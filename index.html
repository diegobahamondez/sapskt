<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAPSKT | DJ &amp; Music Producer</title>
  <meta name="description" content="Official site of SAPSKT - DJ and Music Producer. Photo gallery, mixsets and live performances.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-overlay"></div>

  <main id="app">
    <header class="hero">
      <div class="profile-container">
        <img src="assets/profile.jpeg" alt="SAPSKT profile portrait" class="profile-img">
      </div>
      <h1 class="title">SAPSKT</h1>
      <p class="subtitle">DJ &amp; Music Producer</p>
      <nav class="hero-nav">
        <a href="#music">Music</a>
        <a href="#gallery">Gallery</a>
        <a href="presskit.html">Press Kit</a>
        <a href="https://soundcloud.com/sapskt" target="_blank" rel="noopener">SoundCloud</a>
      </nav>
    </header>

    <section class="music-section" id="music">
      <h2 class="section-title">Music</h2>

      <article class="player-card">
        <div class="player-meta">
          <span class="player-tag">Mixset</span>
          <h3 class="player-title">smile when you dance</h3>
        </div>
        <div class="player-frame player-frame--visual">
          <iframe
            title="SAPSKT — smile when you dance (mixset on SoundCloud)"
            width="100%" height="400" scrolling="no" frameborder="no"
            loading="lazy"
            allow="autoplay; encrypted-media"
            src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fapi.soundcloud.com%2Ftracks%2F2343063593&color=%23a855f7&visual=true&show_artwork=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false"></iframe>
        </div>
        <p class="player-credit">
          <a href="https://soundcloud.com/sapskt/smile-when-you-dance" target="_blank" rel="noopener">Listen on SoundCloud</a>
        </p>
      </article>

      <article class="player-card">
        <div class="player-meta">
          <span class="player-tag">Track</span>
          <h3 class="player-title">Fake Dichotomy</h3>
        </div>
        <div class="player-frame">
          <iframe
            title="SAPSKT — Fake Dichotomy (track on SoundCloud)"
            width="100%" height="166" scrolling="no" frameborder="no"
            loading="lazy"
            allow="autoplay; encrypted-media"
            src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fapi.soundcloud.com%2Ftracks%2F2319999095&color=%23ec4899&visual=false&show_artwork=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false"></iframe>
        </div>
        <p class="player-credit">
          <a href="https://soundcloud.com/sapskt/fake-dichotomy" target="_blank" rel="noopener">Listen on SoundCloud</a>
          <span class="dot">&middot;</span>
          <a href="https://sapskt.bandcamp.com/track/fake-dichotomy" target="_blank" rel="noopener">Free download on Bandcamp</a>
        </p>
      </article>
    </section>

    <section class="gallery-section" id="gallery">
      <h2 class="section-title">Gallery</h2>
      <div class="gallery-grid">
        <div class="gallery-card">
          <img src="assets/dj-from-behind.jpeg" alt="SAPSKT performing live, seen from behind the decks" loading="lazy">
          <div class="card-caption">Live Session</div>
        </div>
        <div class="gallery-card">
          <img src="assets/dj-trippy.jpeg" alt="SAPSKT playing under trippy stage visuals" loading="lazy">
          <div class="card-caption">Visual Experience</div>
        </div>
        <div class="gallery-card">
          <img src="assets/vinyl-collection.jpeg" alt="SAPSKT vinyl record collection" loading="lazy">
          <div class="card-caption">Vinyl Selection</div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 SAPSKT. All rights reserved.</p>
  </footer>
</body>
</html>
